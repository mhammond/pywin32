[build-system]
requires = [
  "setuptools >=84.0.0" # required for compiler initialization compatibility
]
build-backend = "setuptools.build_meta"

[dependency-groups]
checkers = [ # Keep these in sync with .pre-commit-config.yaml
  "clang-format ==18.1.8",
  "ruff ==0.14.14",
]
type-checkers = [
  "types-setuptools",
  "PyOpenGL",
  "mypy ==1.16.*; python_version >='3.9'",
  "pyright ==1.1.401",
]
dev = [
  "pre-commit",
  { include-group = "checkers" },
  { include-group = "type-checkers" },
]
