name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Cancel previous runs for the same PR
  # Don't cancel successive pushes to main
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: &timeout-minutes 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
        python-architecture: [x64, x86, arm64]
        include:
          - os: windows-2022
          - python-architecture: arm64
            os: windows-11-arm
          # Keep setup.py's serial-compile fallback exercised on the fastest job,
          # so it doesn't rot. Every other job builds with one cl.exe/gcc per CPU.
          - python-version: "3.15"
            python-architecture: x64
            build-jobs: 1
        exclude:
          # actions/setup-python does not provide prebuilt arm64 Python before 3.11
          - python-architecture: arm64
            python-version: "3.9"
          - python-architecture: arm64
            python-version: "3.10"
    env:
      # https://docs.python.org/3/library/devmode.html#effects-of-the-python-development-mode
      PYTHONDEVMODE: 1
      # Empty on every job but the one that pins it, which setup.py reads as "unset".
      PYWIN32_BUILD_JOBS: ${{ matrix.build-jobs }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}
          check-latest: true
          allow-prereleases: true

      - name: Build and install
        run: pip install . -v --user

      # This needs to happen *after* installing pywin32 since
      # AutoDuck/py2d.py currently relies on runtime imports for introspection
      # This isn't included in the wheel (TODO: could we?)
      # and only serves as a PR test for the docs.yaml workflow
      - name: Generate PyWin32.chm help file
        run: python AutoDuck/make.py

      # Smokescreen test to validate postinstall doesn't crash, dlls can be found, and both pathless invocation methods work
      - name: Run postinstall install/remove
        run: |
          $UserSite = "$(python -m site --user-site)"
          python -m win32.scripts.pywin32_postinstall -install -destination "$UserSite"
          pywin32_postinstall -remove -destination "$UserSite"

      # Compilation and registration of the PyCOMTest server dll
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build and register the PyCOMTest server dll
        # Pass Silent flag to regsvr32 to avoid hanging on confirmation window
        run: com/TestSources/PyCOMTest/buildAndRegister.bat /s

      - name: Run tests
        # Run the tests directly from the source dir so support files (eg, .wav files etc)
        # can be found - they aren't installed into the Python tree.
        run: python win32/scripts/pywin32_testall.py -v -skip-adodbapi

      # Not a redundant second build: only this wheel includes PyWin32.chm, generated above.
      # It reuses the build folder from the install step, so up-to-date extensions aren't recompiled.
      - name: Build wheels
        if: ${{ !contains(matrix.python-version, 't') }}
        run: pip wheel . -v --wheel-dir=dist

      - uses: actions/upload-artifact@v4
        # Upload artifacts even if tests fail
        if: ${{ !contains(matrix.python-version, 't') }}
        with:
          name: artifacts-${{ matrix.python-version }}-${{ matrix.python-architecture }}
          path: dist/*.whl
          if-no-files-found: error

  pypy:
    name: Build and smoke test PyPy
    runs-on: windows-2022
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      # Build once, then test the very wheel that gets uploaded.
      - name: Build wheels
        run: uv build --wheel
      - name: Install
        run: uv pip install pywin32 --no-index --find-links=dist

      # Each import runs in a fresh process, and in its own step so a failure names the order that broke.
      # Importing win32api first makes Windows resolve pywintypesXY.dll while loading win32api.pyd,
      # before pywintypes.py can load it. That only works if PyPy's extension loader searches the
      # directories pywin32_bootstrap adds with os.add_dll_directory.
      - name: Import win32api before pywintypes
        run: python -c "import win32api; import pywintypes; print(win32api.__file__, pywintypes.__file__)"

      - name: Import pywintypes before win32api
        run: python -c "import pywintypes; import win32api; print(pywintypes.__file__, win32api.__file__)"

      - name: Import pythoncom
        run: python -c "import pythoncom; print(pythoncom.__file__)"

      - name: Import win32com.client
        run: python -c "import win32com.client"

      # TODO: Temporary diagnostics for an intermittent access violation (0xC0000005) during import, remove once fixed.
      # Reruns under cdb until a few crashes are caught, and prints the faulting stack.
      - name: Catch the access violation under cdb
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import os
          import subprocess
          import sys

          cdbs = glob.glob(r"C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe")
          if not cdbs:
              sys.exit("cdb.exe not found")
          cdb = cdbs[0]
          pdb_dirs = glob.glob(os.path.join("build", "temp.*", "Release"))
          sympath = ";".join([*map(os.path.abspath, pdb_dirs), r"srv*C:\symbols*https://msdl.microsoft.com/download/symbols"])
          script = "import win32com.client; d = win32com.client.Dispatch('Scripting.Dictionary'); d.Add('key', 'value'); assert d.Item('key') == 'value'; print('script done', flush=True)"
          # Only stop on an unhandled (second chance) access violation, then dump what we can.
          # -o also debugs child processes, in case the venv's python.exe launches the real interpreter.
          commands = 'sxd -c2 ".echo === CRASH ===; .ecxr; kv 60; r; .lastevent; q" av; g; q'
          crashes = 0
          for i in range(1, 31):
              result = subprocess.run(
                  [cdb, "-o", "-g", "-G", "-lines", "-y", sympath, "-c", commands, sys.executable, "-u", "-c", script],
                  capture_output=True,
                  text=True,
                  errors="replace",
                  timeout=600,
              )
              crashed = "=== CRASH ===" in result.stdout
              print(f"run {i}: crashed={crashed} exit={result.returncode}", flush=True)
              if crashed:
                  crashes += 1
                  print(result.stdout[result.stdout.index("=== CRASH ==="):], flush=True)
                  if crashes >= 3:
                      break

      - name: Use a COM client
        run: python -c "import win32com.client; d = win32com.client.Dispatch('Scripting.Dictionary'); d.Add('key', 'value'); assert d.Item('key') == 'value'"

      - uses: actions/upload-artifact@v4
        # Upload artifacts even if tests fail, so a failure can be reproduced from the built wheel
        if: ${{ !cancelled() }}
        with:
          name: artifacts-${{ matrix.python-version }}-x64
          path: dist/*.whl
          if-no-files-found: error

  # actions/setup-python does not provide prebuilt arm64 Python before 3.11, so we cross-compile.
  cross_compile_arm64:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    name: Cross-compile ARM64
    runs-on: windows-2022
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        # pythonarm64 NuGet has no download for Python ~=3.9.11 and ~=3.10.12
        python-version: ["3.9.10", "3.10.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Obtain ARM64 library files
        run: python .github\workflows\download-arm64-libs.py ./arm64libs

      - name: Build wheels
        if: ${{ !contains(matrix.python-version, 't') }}
        run: uv build --wheel --config-setting=--build-option="build_ext -L./arm64libs --plat-name=win-arm64 build --plat-name=win-arm64 bdist_wheel --plat-name=win-arm64"

      - uses: actions/upload-artifact@v4
        with:
          if: ${{ !contains(matrix.python-version, 't') }}
          name: artifacts-${{ matrix.python-version }}-arm64
          path: dist/*.whl
          if-no-files-found: error

  merge:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    needs: [test, pypy, cross_compile_arm64]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        if: ${{ !contains(matrix.python-version, 't') }}
        with:
          name: artifacts
          pattern: artifacts-*
      - name: Delete standalone Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: artifacts-*
  build_msys2_mingw:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ${{ matrix.plat-name == 'win-arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: *timeout-minutes
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        # https://www.msys2.org/docs/environments/#overview
        include:
          # Using legacy environments (MSVCRT) as long as we support Windows 8.1
          - { sys: mingw64, env: x86_64, plat-name: win-amd64 }
          - { sys: mingw32, env: i686, plat-name: win32 }
          # Modern environment (Windows 10 / Windows Server 2016)
          # - { sys: ucrt64, env: ucrt-x86_64, plat-name: win-amd64 }
          # ARM only available using Clang
          - { sys: clangarm64, env: clang-aarch64, plat-name: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: |
            mingw-w64-${{matrix.env}}-cc
            mingw-w64-${{matrix.env}}-python
            mingw-w64-${{matrix.env}}-python-build
            ${{ startsWith(matrix.env, 'clang-') && 'binutils' || '' }}

      - name: Build and install
        # Having to specify plat-name here is definitely hacky, not sure why setuptools fails with
        # error: --plat-name must be one of ('win32', 'win-amd64', 'win-arm32', 'win-arm64')
        #
        # We don't actually need wheels, but this causes a direct-from-source build,
        # so we can reference files that wouldn't be copied in a temp sdist folder
        run: python -m build --wheel -v --config-setting=--build-option="build_ext --plat-name=${{matrix.plat-name}} build --plat-name=${{matrix.plat-name}} bdist_wheel --plat-name=${{matrix.plat-name}}"

  # This job can be run locally by running `pre-commit run`
  checkers:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: *timeout-minutes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # This job only needs to target the oldest supported version
          python-version: "3.9"
          activate-environment: true
      - run: uv pip install --group=checkers

      # !cancelled(): Show issues even if the previous steps failed. But still fail the job
      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        if: ${{ !cancelled() }}
      - name: Run Ruff formatter
        run: ruff format --check
        if: ${{ !cancelled() }}

      # Too many files to fit in a single command, also exclude vendored Scintilla and MAPIStubLibrary
      - run: |
          clang-format --Werror --dry-run $(git ls-files '*.cpp' ':!:com/win32comext/mapi/src/MAPIStubLibrary/')
          if ($LastExitCode -ne 0) { exit $LastExitCode }
        shell: pwsh
        if: ${{ !cancelled() }}
      - run: |
          clang-format --Werror --dry-run $(git ls-files '*.h' ':!:pythonwin/Scintilla/' ':!:com/win32comext/mapi/src/MAPIStubLibrary/')
          if ($LastExitCode -ne 0) { exit $LastExitCode }
        shell: pwsh
        if: ${{ !cancelled() }}

  type-checkers:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        # Only test the oldest and newest supported Python. This should cover new breaking changes and support drops.
        # Drawback is a less obvious failure boundary, but worth due to https://gh.io/actions-limits
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install --group=type-checkers

      - run: mypy . --python-version=${{ matrix.python-version }}

      - uses: jakebailey/pyright-action@v2
        with:
          python-version: ${{ matrix.python-version }}
          version: PATH
          annotate: errors
        # Show issues even if the previous steps failed. But still fail the job
        if: ${{ !cancelled() }}
