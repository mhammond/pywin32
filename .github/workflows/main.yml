name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Cancel previous runs for the same PR
  # Don't cancel successive pushes to main
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: &timeout-minutes 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
        python-architecture: [x64, x86, arm64]
        include:
          - os: windows-2022
          - python-architecture: arm64
            os: windows-11-arm
          # Keep setup.py's serial-compile fallback exercised on the fastest job,
          # so it doesn't rot. Every other job builds with one cl.exe/gcc per CPU.
          - python-version: "3.15"
            python-architecture: x64
            build-jobs: 1
        exclude:
          # actions/setup-python does not provide prebuilt arm64 Python before 3.11
          - python-architecture: arm64
            python-version: "3.9"
          - python-architecture: arm64
            python-version: "3.10"
    env:
      # https://docs.python.org/3/library/devmode.html#effects-of-the-python-development-mode
      PYTHONDEVMODE: 1
      # Empty on every job but the one that pins it, which setup.py reads as "unset".
      PYWIN32_BUILD_JOBS: ${{ matrix.build-jobs }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}
          check-latest: true
          allow-prereleases: true

      - name: Build and install
        run: pip install . -v --user

      # This needs to happen *after* installing pywin32 since
      # AutoDuck/py2d.py currently relies on runtime imports for introspection
      # This isn't included in the wheel (TODO: could we?)
      # and only serves as a PR test for the docs.yaml workflow
      - name: Generate PyWin32.chm help file
        run: python AutoDuck/make.py

      # Smokescreen test to validate postinstall doesn't crash, dlls can be found, and both pathless invocation methods work
      - name: Run postinstall install/remove
        run: |
          $UserSite = "$(python -m site --user-site)"
          python -m win32.scripts.pywin32_postinstall -install -destination "$UserSite"
          pywin32_postinstall -remove -destination "$UserSite"

      # Compilation and registration of the PyCOMTest server dll
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build and register the PyCOMTest server dll
        # Pass Silent flag to regsvr32 to avoid hanging on confirmation window
        run: com/TestSources/PyCOMTest/buildAndRegister.bat /s

      - name: Run tests
        # Run the tests directly from the source dir so support files (eg, .wav files etc)
        # can be found - they aren't installed into the Python tree.
        run: python win32/scripts/pywin32_testall.py -v -skip-adodbapi

      # Not a redundant second build: only this wheel includes PyWin32.chm, generated above.
      # It reuses the build folder from the install step, so up-to-date extensions aren't recompiled.
      - name: Build wheels
        if: ${{ !contains(matrix.python-version, 't') }}
        run: pip wheel . -v --wheel-dir=dist

      - uses: actions/upload-artifact@v4
        # Upload artifacts even if tests fail
        if: ${{ !contains(matrix.python-version, 't') }}
        with:
          name: artifacts-${{ matrix.python-version }}-${{ matrix.python-architecture }}
          path: dist/*.whl
          if-no-files-found: error

  pypy:
    name: Build and smoke test PyPy
    runs-on: windows-2022
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      # Build once, then test the very wheel that gets uploaded.
      - name: Build wheels
        run: uv build --wheel
      - name: Install
        run: uv pip install pywin32 --no-index --find-links=dist

      # TODO: Temporary diagnostics, remove once the crash below is fixed.
      # The crash doesn't happen under a debugger, and Windows Error Reporting writes no dumps on the runners.
      # So every Python process loads this DLL (through a .pth file), which writes a full dump to
      # VEHDUMP_DIR from a vectored exception handler.
      - name: Build crash dump DLL
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\vehdump.c"
          Set-Content -Path $src -Value @'
          // Writes a full-memory minidump on the first access violation, then lets the crash continue.
          #include <windows.h>
          #include <dbghelp.h>
          #include <stdio.h>
          #pragma comment(lib, "dbghelp.lib")

          static volatile LONG done = 0;

          static LONG CALLBACK handler(PEXCEPTION_POINTERS ep)
          {
              DWORD code = ep->ExceptionRecord->ExceptionCode;
              if (code != EXCEPTION_ACCESS_VIOLATION && code != STATUS_HEAP_CORRUPTION && code != STATUS_STACK_BUFFER_OVERRUN)
                  return EXCEPTION_CONTINUE_SEARCH;
              if (InterlockedExchange(&done, 1))
                  return EXCEPTION_CONTINUE_SEARCH;
              WCHAR dir[MAX_PATH], path[MAX_PATH];
              DWORD n = GetEnvironmentVariableW(L"VEHDUMP_DIR", dir, MAX_PATH);
              if (!n || n >= MAX_PATH)
                  return EXCEPTION_CONTINUE_SEARCH;
              swprintf_s(path, MAX_PATH, L"%s\\vehdump-%lu.dmp", dir, GetCurrentProcessId());
              HANDLE f = CreateFileW(path, GENERIC_WRITE, 0, NULL, CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
              if (f != INVALID_HANDLE_VALUE) {
                  MINIDUMP_EXCEPTION_INFORMATION mei = {GetCurrentThreadId(), ep, FALSE};
                  MiniDumpWriteDump(GetCurrentProcess(), GetCurrentProcessId(), f,
                                    MiniDumpWithFullMemory | MiniDumpWithHandleData | MiniDumpWithThreadInfo, &mei, NULL, NULL);
                  CloseHandle(f);
              }
              return EXCEPTION_CONTINUE_SEARCH;
          }

          BOOL WINAPI DllMain(HINSTANCE h, DWORD reason, LPVOID r)
          {
              if (reason == DLL_PROCESS_ATTACH)
                  AddVectoredExceptionHandler(1, handler);
              return TRUE;
          }
          '@
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dll = "$env:RUNNER_TEMP\vehdump.dll"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /O1 /LD `"$src`" /Fo`"$env:RUNNER_TEMP\\`" /Fe`"$dll`""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dumps = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps").FullName
          $purelib = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Set-Content -Path "$purelib\00vehdump.pth" -Value "import os, ctypes; 'VEHDUMP_DIR' in os.environ and ctypes.WinDLL(r'$dll')"
          "VEHDUMP_DIR=$dumps" >> $env:GITHUB_ENV
          # Self-test: a NULL write crashes PyPy, which must leave exactly one dump.
          $env:VEHDUMP_DIR = $dumps
          python -c "import ctypes; ctypes.memset(0, 0, 1)"
          $selftest = @(Get-ChildItem "$dumps\*.dmp")
          if ($selftest.Count -ne 1) { throw "Self-test crash wrote $($selftest.Count) dumps" }
          Remove-Item $selftest
          $global:LASTEXITCODE = 0

      # Each import runs in a fresh process, and in its own step so a failure names the order that broke.
      # Importing win32api first makes Windows resolve pywintypesXY.dll while loading win32api.pyd,
      # before pywintypes.py can load it. That only works if PyPy's extension loader searches the
      # directories pywin32_bootstrap adds with os.add_dll_directory.
      - name: Import win32api before pywintypes
        run: python -c "import win32api; import pywintypes; print(win32api.__file__, pywintypes.__file__)"

      - name: Import pywintypes before win32api
        run: python -c "import pywintypes; import win32api; print(pywintypes.__file__, win32api.__file__)"

      - name: Import pythoncom
        run: python -c "import pythoncom; print(pythoncom.__file__)"

      - name: Import win32com.client
        run: python -c "import win32com.client"

      # Repeated in fresh processes, as crashes are intermittent (exit code 0xC0000005 with no output).
      # Caused by PyPy's _Py_NewReference (pypy/pypy#5822, worked around in PyWinTypes.h).
      - name: Use a COM client
        shell: python
        run: |
          import collections
          import subprocess
          import sys

          script = """
          import faulthandler, sys
          faulthandler.enable()
          def step(name): print(name, file=sys.stderr, flush=True)
          step("import"); import win32com.client
          step("Dispatch"); d = win32com.client.Dispatch("Scripting.Dictionary")
          step("Add"); d.Add("key", "value")
          step("Item"); assert d.Item("key") == "value"
          step("exit")
          """
          steps = ("import", "Dispatch", "Add", "Item", "exit")
          results = [subprocess.run([sys.executable, "-c", script], capture_output=True, text=True) for _ in range(30)]
          failures = [r for r in results if r.returncode]
          last_steps = collections.Counter(
              next((line for line in reversed(r.stderr.splitlines()) if line in steps), None) for r in failures
          )
          print(f"{len(failures)}/{len(results)} runs failed, by last step reached: {dict(last_steps)}")
          for r in failures[:3]:
              print(f"--- exit code 0x{r.returncode & 0xFFFFFFFF:08X}\n{r.stdout}{r.stderr}")
          sys.exit(bool(failures))

      # TODO: Temporary diagnostics, remove once the crash above is fixed.
      # Prints the crash stack of the first dump, then uploads the dumps with the PDBs to open them locally.
      - name: Analyze crash dumps
        if: failure()
        shell: python
        run: |
          import glob
          import os
          import shutil
          import subprocess

          dump_dir = os.environ["VEHDUMP_DIR"]
          dumps = sorted(glob.glob(os.path.join(dump_dir, "*.dmp")), key=os.path.getmtime)
          print(f"{len(dumps)} dump(s), keeping the first 3: {[os.path.basename(dump) for dump in dumps]}", flush=True)
          for dump in dumps[3:]:
              os.remove(dump)
          dumps = dumps[:3]
          pdb_dir = os.path.join(dump_dir, "pdb")
          os.makedirs(pdb_dir, exist_ok=True)
          for pdb in glob.glob("build/**/*.pdb", recursive=True):
              shutil.copy2(pdb, pdb_dir)
          sympath = ";".join([pdb_dir, r"srv*C:\symbols*https://msdl.microsoft.com/download/symbols"])
          cdb = r"C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          for dump in dumps[:1]:
              result = subprocess.run(
                  [cdb, "-z", dump, "-lines", "-y", sympath, "-c", ".ecxr; kv 60; r; ub @rip L10; u @rip L4; lm; q"],
                  capture_output=True,
                  text=True,
                  errors="replace",
                  timeout=600,
              )
              print(f"=== {os.path.basename(dump)} ===\n{result.stdout}{result.stderr}", flush=True)

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.python-version }}
          path: ${{ env.VEHDUMP_DIR }}
          retention-days: 3

      - uses: actions/upload-artifact@v4
        # Upload artifacts even if tests fail, so a failure can be reproduced from the built wheel
        if: ${{ !cancelled() }}
        with:
          name: artifacts-${{ matrix.python-version }}-x64
          path: dist/*.whl
          if-no-files-found: error

  # actions/setup-python does not provide prebuilt arm64 Python before 3.11, so we cross-compile.
  cross_compile_arm64:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    name: Cross-compile ARM64
    runs-on: windows-2022
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        # pythonarm64 NuGet has no download for Python ~=3.9.11 and ~=3.10.12
        python-version: ["3.9.10", "3.10.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Obtain ARM64 library files
        run: python .github\workflows\download-arm64-libs.py ./arm64libs

      - name: Build wheels
        if: ${{ !contains(matrix.python-version, 't') }}
        run: uv build --wheel --config-setting=--build-option="build_ext -L./arm64libs --plat-name=win-arm64 build --plat-name=win-arm64 bdist_wheel --plat-name=win-arm64"

      - uses: actions/upload-artifact@v4
        with:
          if: ${{ !contains(matrix.python-version, 't') }}
          name: artifacts-${{ matrix.python-version }}-arm64
          path: dist/*.whl
          if-no-files-found: error

  merge:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    needs: [test, pypy, cross_compile_arm64]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        if: ${{ !contains(matrix.python-version, 't') }}
        with:
          name: artifacts
          pattern: artifacts-*
      - name: Delete standalone Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: artifacts-*
  build_msys2_mingw:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ${{ matrix.plat-name == 'win-arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: *timeout-minutes
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        # https://www.msys2.org/docs/environments/#overview
        include:
          # Using legacy environments (MSVCRT) as long as we support Windows 8.1
          - { sys: mingw64, env: x86_64, plat-name: win-amd64 }
          - { sys: mingw32, env: i686, plat-name: win32 }
          # Modern environment (Windows 10 / Windows Server 2016)
          # - { sys: ucrt64, env: ucrt-x86_64, plat-name: win-amd64 }
          # ARM only available using Clang
          - { sys: clangarm64, env: clang-aarch64, plat-name: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: |
            mingw-w64-${{matrix.env}}-cc
            mingw-w64-${{matrix.env}}-python
            mingw-w64-${{matrix.env}}-python-build
            ${{ startsWith(matrix.env, 'clang-') && 'binutils' || '' }}

      - name: Build and install
        # Having to specify plat-name here is definitely hacky, not sure why setuptools fails with
        # error: --plat-name must be one of ('win32', 'win-amd64', 'win-arm32', 'win-arm64')
        #
        # We don't actually need wheels, but this causes a direct-from-source build,
        # so we can reference files that wouldn't be copied in a temp sdist folder
        run: python -m build --wheel -v --config-setting=--build-option="build_ext --plat-name=${{matrix.plat-name}} build --plat-name=${{matrix.plat-name}} bdist_wheel --plat-name=${{matrix.plat-name}}"

  # This job can be run locally by running `pre-commit run`
  checkers:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: *timeout-minutes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # This job only needs to target the oldest supported version
          python-version: "3.9"
          activate-environment: true
      - run: uv pip install --group=checkers

      # !cancelled(): Show issues even if the previous steps failed. But still fail the job
      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        if: ${{ !cancelled() }}
      - name: Run Ruff formatter
        run: ruff format --check
        if: ${{ !cancelled() }}

      # Too many files to fit in a single command, also exclude vendored Scintilla and MAPIStubLibrary
      - run: |
          clang-format --Werror --dry-run $(git ls-files '*.cpp' ':!:com/win32comext/mapi/src/MAPIStubLibrary/')
          if ($LastExitCode -ne 0) { exit $LastExitCode }
        shell: pwsh
        if: ${{ !cancelled() }}
      - run: |
          clang-format --Werror --dry-run $(git ls-files '*.h' ':!:pythonwin/Scintilla/' ':!:com/win32comext/mapi/src/MAPIStubLibrary/')
          if ($LastExitCode -ne 0) { exit $LastExitCode }
        shell: pwsh
        if: ${{ !cancelled() }}

  type-checkers:
    # TODO: Temporarily disabled while iterating on the PyPy job, re-enable before merging
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: *timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        # Only test the oldest and newest supported Python. This should cover new breaking changes and support drops.
        # Drawback is a less obvious failure boundary, but worth due to https://gh.io/actions-limits
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install --group=type-checkers

      - run: mypy . --python-version=${{ matrix.python-version }}

      - uses: jakebailey/pyright-action@v2
        with:
          python-version: ${{ matrix.python-version }}
          version: PATH
          annotate: errors
        # Show issues even if the previous steps failed. But still fail the job
        if: ${{ !cancelled() }}
