[mypy]
show_column_numbers = true
; Needs to be set for non-Windows CI runners
platform = win32
; Target the oldest supported version in editors and default CLI
python_version = 3.9

strict = true
implicit_reexport = true
; Redefinitions with different types, including in other blocks
; TODO: Rename to allow_redefinition once on mypy 2+ (needs python_version >= 3.10), where it's the default behaviour
allow_redefinition_new = true
; Required by allow_redefinition_new, default in mypy 2+
local_partial_types = true
; Necessary to avoid "same module name" issues
explicit_package_bases = true
; Must specify top-level packages and scripts folders for mypy to work with explicit_package_bases
mypy_path =
    $MYPY_CONFIG_FILE_DIR/adodbapi/test,
    $MYPY_CONFIG_FILE_DIR/AutoDuck,
    $MYPY_CONFIG_FILE_DIR/com,
    $MYPY_CONFIG_FILE_DIR/com/win32comext/axdebug/test,
    $MYPY_CONFIG_FILE_DIR/pythonwin,
    $MYPY_CONFIG_FILE_DIR/pythonwin/pywin/Demos,
    $MYPY_CONFIG_FILE_DIR/win32/Demos,
    $MYPY_CONFIG_FILE_DIR/win32/Demos/security,
    $MYPY_CONFIG_FILE_DIR/win32/Demos/service,
    $MYPY_CONFIG_FILE_DIR/win32/Demos/win32wnet,
    $MYPY_CONFIG_FILE_DIR/win32/Lib,
    $MYPY_CONFIG_FILE_DIR/win32/scripts/VersionStamp,

; TODO: Gradually type classes and functions until we can turn back check_untyped_defs to true.
; For now this allows us to at least put mypy in place by massively reducing checked code
check_untyped_defs = false
; Implicit return types !
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

disable_error_code =
    ; Module has no attribute; (Dynamic modules will be hard to type without type stubs, ie: pythoncom.*)
    attr-defined,
    ; Class cannot subclass "..." (has type "Any"); (IDEM)
    misc,
    ; These are the other error codes that would currently fail with check_untyped_defs = true
    ; and have no PR already open to fix them
    ; TODO: Gradually fix them until we can turn on check_untyped_defs
    ; arg-type,
    ; assignment,
    ; call-arg,
    ; has-type,
    ; index,
    ; operator,
    ; override,
    ; union-attr,
    ; var-annotated,
    ; ; And these only happen when checking against types-pywin32
    ; func-returns-value,
    ; call-overload,
    ; no-redef,
    ; str-unpack,
exclude = (?x)(
          ^build/
          ; Vendored
          | ^pythonwin/Scintilla/
          ; Forked IDLE extensions predating Python 2.3. They now live in idlelib in https://github.com/python/cpython/tree/main/Lib/idlelib
          | ^pythonwin/pywin/idle/
          )

; TODO: Fix in separate adodbapi PR
[mypy-adodbapi.adodbapi]
disable_error_code = comparison-overlap

; TODO: Real bugs in adodbapi's tests, fixed by https://github.com/mhammond/pywin32/pull/2730
; Same options as the demos and tests section below.
; Not listed there, because a module named in two sections only keeps the last disable_error_code.
[mypy-adodbapitest,adodbapitestconfig,test_adodbapi_dbapi20]
allow_untyped_globals = true
disable_error_code =
    ; adodbapitest: loadTestsFromModule is passed TestCase classes
    arg-type,
    ; test_adodbapi_dbapi20: makemdb is missing its mdb_name argument
    call-arg,
    ; Type confusions and base class attribute overrides
    assignment,
    name-defined,
    union-attr,

; Demos, examples, samples and tests are the main real usage of the API, so they are checked to validate its annotations.
; Their own code isn't held to the same standard, but API misuse is still reported.
; Modules made top-level by their mypy_path entry can't be matched by the wildcards,
; so only the ones needing these options are listed, others are checked with the stricter defaults:
; - dbapi20 is adodbapi's tests,
; - app.*, menutest and ocx.* are pywin's demos,
; - desktopmanager, FileSecurityTest, pipeTestService, pipeTestServiceClient, sspi.simple_auth and testwnet are win32's demos.
[mypy-*.demos.*,*.examples.*,*.samples.*,*.test.*,app.*,dbapi20,desktopmanager,FileSecurityTest,menutest,ocx.*,pipeTestService,pipeTestServiceClient,sspi.simple_auth,testwnet]
; No annotations needed for global and class variables
allow_untyped_globals = true
disable_error_code =
    ; A lot of demos and tests will star-import constants from win32com,
    ; which can't be analyzed/followed unless using typeshed's types-pywin32.
    ; Or subclass modules generated at runtime by gencache.EnsureModule.
    name-defined,

; Subclasses override the base class' `description = None` with a str
; [mypy-win32comext.shell.demos.servers.folder_view]
; disable_error_code = assignment

; C-modules that will need type-stubs
[mypy-adsi.*,dde,exchange,mapi,odbc,mmapfile,perfmon,servicemanager,timer,win32api,win32console,win32clipboard,win32comext.adsi.adsi,win32cred,win32crypt,win32event,win32evtlog,win32file,win32gui,win32help,win32inet,win32net,win32pdh,win32pipe,win32print,win32process,win32profile,win32ras,win32security,win32service,win32trace,win32transaction,win32ts,win32ui,win32uiole,win32wnet,_win32sysloader,_winxptheme]
ignore_missing_imports = True

; pywin32_system32 is an empty module created in setup.py to store dlls
; OpenGL is untyped
; test is a local untyped module in win32comext.axdebug
; Most of win32com re-exports win32comext
[mypy-pywin32_system32,OpenGL.*,test,win32com.*]
ignore_missing_imports = True
